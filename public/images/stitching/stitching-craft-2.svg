<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="denimGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldSpoolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueSpoolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="80%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="tapeYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Deep Slate & Indigo Background -->
  <rect width="600" height="400" fill="url(#denimGrad2)" rx="12" />

  <!-- Diagonal Accent Seams -->
  <path d="M 0 120 L 600 40" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.4" />
  <path d="M 0 135 L 600 55" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6" opacity="0.5" />

  <!-- Flowing Golden Thread Loop from Spool -->
  <path d="M 230 180 C 270 90, 380 80, 420 160 C 450 220, 360 260, 480 320" 
        stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M 230 180 C 270 90, 380 80, 420 160 C 450 220, 360 260, 480 320" 
        stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Spool 1: Grand Golden Yellow Thread Spool -->
  <g transform="translate(140, 110)" filter="url(#softShadow)">
    <!-- Wooden Spool Top Flange -->
    <ellipse cx="60" cy="15" rx="55" ry="14" fill="url(#woodGrad)" />
    <ellipse cx="60" cy="12" rx="46" ry="10" fill="#b45309" />
    <circle cx="60" cy="12" r="10" fill="#451a03" />

    <!-- Spun Gold Thread Barrel -->
    <rect x="15" y="15" width="90" height="130" rx="6" fill="url(#goldSpoolGrad)" />
    <!-- Fine Thread Windings Pattern -->
    <line x1="15" y1="35" x2="105" y2="35" stroke="#fef08a" stroke-width="1" opacity="0.6" />
    <line x1="15" y1="55" x2="105" y2="55" stroke="#b45309" stroke-width="1" opacity="0.4" />
    <line x1="15" y1="75" x2="105" y2="75" stroke="#fef08a" stroke-width="1" opacity="0.6" />
    <line x1="15" y1="95" x2="105" y2="95" stroke="#b45309" stroke-width="1" opacity="0.4" />
    <line x1="15" y1="115" x2="105" y2="115" stroke="#fef08a" stroke-width="1" opacity="0.6" />
    <line x1="15" y1="135" x2="105" y2="135" stroke="#b45309" stroke-width="1" opacity="0.4" />

    <!-- Wooden Spool Bottom Flange -->
    <ellipse cx="60" cy="145" rx="55" ry="14" fill="url(#woodGrad)" />
  </g>

  <!-- Spool 2: Companion Royal Blue Thread Spool -->
  <g transform="translate(265, 150)" filter="url(#softShadow)">
    <ellipse cx="45" cy="12" rx="40" ry="11" fill="url(#woodGrad)" />
    <circle cx="45" cy="10" r="8" fill="#451a03" />
    <rect x="10" y="12" width="70" height="100" rx="5" fill="url(#blueSpoolGrad)" />
    <line x1="10" y1="35" x2="80" y2="35" stroke="#93c5fd" stroke-width="0.8" opacity="0.5" />
    <line x1="10" y1="65" x2="80" y2="65" stroke="#1e3a8a" stroke-width="0.8" opacity="0.6" />
    <line x1="10" y1="90" x2="80" y2="90" stroke="#93c5fd" stroke-width="0.8" opacity="0.5" />
    <ellipse cx="45" cy="112" rx="40" ry="11" fill="url(#woodGrad)" />
  </g>

  <!-- Curving Tailor Measuring Tape (Classic Yellow) -->
  <g transform="translate(0, 310)" filter="url(#softShadow)">
    <path d="M -20 50 Q 180 -15 360 30 T 620 15" stroke="url(#tapeYellow)" stroke-width="32" fill="none" stroke-linecap="round" />
    <path d="M -20 50 Q 180 -15 360 30 T 620 15" stroke="#854d0e" stroke-width="1" fill="none" />
    
    <!-- Measuring Ticks -->
    <path d="M 60 25 L 60 35 M 90 20 L 90 32 M 120 17 L 120 30 M 150 15 L 150 28 M 180 14 L 180 27 M 210 16 L 210 28 M 240 18 L 240 31 M 270 23 L 270 35 M 300 27 L 300 39 M 330 32 L 330 44 M 360 34 L 360 46 M 390 33 L 390 45 M 420 30 L 420 42 M 450 26 L 450 38 M 480 22 L 480 34 M 510 19 L 510 31 M 540 17 L 540 29" stroke="#713f12" stroke-width="2" />
    <text x="120" y="44" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#713f12">24</text>
    <text x="240" y="46" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#713f12">25</text>
    <text x="360" y="58" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#713f12">26</text>
    <text x="480" y="47" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#713f12">27</text>
  </g>

  <!-- Elegant Status Overlay Badge -->
  <g transform="translate(30, 30)">
    <rect width="180" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#eab308" stroke-width="1.5" />
    <circle cx="18" cy="17" r="5" fill="#facc15" />
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fef08a" letter-spacing="0.5">
      CORE-SPUN SPOOLS
    </text>
  </g>
</svg>
