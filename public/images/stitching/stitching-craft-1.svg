<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="denimGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="40%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="goldThreadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="needleChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <radialGradient id="needleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <!-- Denim Texture Pattern -->
    <pattern id="twillHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="1.2" opacity="0.18" />
      <line x1="4" y1="0" x2="4" y2="8" stroke="#1d4ed8" stroke-width="1.2" opacity="0.25" />
    </pattern>
    <!-- Soft Glow Filter -->
    <filter id="stitchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" fill="url(#denimGrad1)" rx="12" />
  <!-- Twill Weave Texture Overlay -->
  <rect width="600" height="400" fill="url(#twillHatch)" rx="12" />

  <!-- Fabric Panel Fold Shadow -->
  <path d="M-20 280 Q 220 250 620 290 L620 420 L-20 420 Z" fill="#090e1d" opacity="0.75" />
  <path d="M-20 280 Q 220 250 620 290" stroke="#1e40af" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Tailor Chalk Guide Line -->
  <path d="M 40 180 Q 300 130 560 170" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round" opacity="0.4" />

  <!-- Primary Golden Stitch Line 1 (Bold, Topstitch) -->
  <path d="M 30 195 Q 300 145 570 185" stroke="#f59e0b" stroke-width="5" stroke-dasharray="16 10" stroke-linecap="round" filter="url(#stitchGlow)" />
  <path d="M 30 195 Q 300 145 570 185" stroke="#fef08a" stroke-width="2" stroke-dasharray="16 10" stroke-linecap="round" />

  <!-- Parallel Golden Stitch Line 2 (Twin needle effect) -->
  <path d="M 35 210 Q 300 160 575 200" stroke="#d97706" stroke-width="4.5" stroke-dasharray="16 10" stroke-linecap="round" opacity="0.9" />
  <path d="M 35 210 Q 300 160 575 200" stroke="#fde047" stroke-width="1.8" stroke-dasharray="16 10" stroke-linecap="round" />

  <!-- Backstitch Detail in Forefront -->
  <path d="M 40 320 Q 280 290 560 330" stroke="#fbbf24" stroke-width="3.5" stroke-dasharray="12 8" stroke-linecap="round" opacity="0.65" />

  <!-- Needle Piercing Glow -->
  <circle cx="360" cy="155" r="45" fill="url(#needleGlow)" />

  <!-- Industrial Sewing Needle -->
  <g transform="rotate(-18 360 155)">
    <!-- Needle Shank & Blade -->
    <rect x="355" y="-30" width="10" height="180" rx="3" fill="url(#needleChrome)" />
    <!-- Needle Taper Tip -->
    <polygon points="355,150 365,150 360,195" fill="url(#needleChrome)" />
    <!-- Needle Eye -->
    <rect x="358" y="160" width="4" height="16" rx="2" fill="#0f172a" />

    <!-- Golden Thread passing through needle eye -->
    <path d="M 360 -40 C 370 40, 362 100, 360 168 C 358 185, 330 200, 300 190" stroke="url(#goldThreadGrad)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#stitchGlow)" />
    <path d="M 360 168 C 362 180, 400 185, 430 175" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Golden Floating Stitch Points / Particles -->
  <circle cx="150" cy="80" r="3" fill="#fde047" opacity="0.6" />
  <circle cx="210" cy="65" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="480" cy="85" r="3" fill="#f59e0b" opacity="0.6" />
  <circle cx="520" cy="115" r="2" fill="#fef08a" opacity="0.4" />

  <!-- Elegant Status Overlay Badge -->
  <g transform="translate(30, 30)">
    <rect width="180" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="18" cy="17" r="5" fill="#f59e0b" />
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
      TWIN LOCKSTITCH
    </text>
  </g>

  <g transform="translate(420, 335)">
    <rect width="150" height="32" rx="6" fill="#1e3a8a" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="75" y="21" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#fef08a">
      GOLD THREAD 12 SPI
    </text>
  </g>
</svg>
